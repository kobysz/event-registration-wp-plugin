name: CI

# Na push (master) lecą tylko szybkie, pewne joby: js-unit + static-analysis.
# integration i e2e stoją na wp-env (Docker) — ciężkie i flaky w GH Actions —
# więc odpalają się tylko na pull_request i ręcznie (workflow_dispatch).
# Źródłem prawdy dla integration/e2e są testy lokalne (wp-env) przed pushem.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  js-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - run: npm run test:js

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - run: composer install --prefer-dist --no-progress

      - name: PHPCS
        run: composer lint

      - name: PHPStan
        run: composer analyse

      - name: Testy jednostkowe
        run: composer test:unit

  integration:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - run: composer install --prefer-dist --no-progress

      - run: node scripts/wp-env.cjs start

      - name: Testy integracyjne
        run: node scripts/wp-env.cjs run tests-cli --env-cwd=wp-content/plugins/event-registration -- vendor/bin/phpunit -c phpunit-integration.xml.dist

  e2e:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/wp-env.cjs start
      - run: npm run test:e2e
